<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" id="Layer_1" x="0" y="0" version="1.1" viewBox="0 0 72 72">
    <style>
        .st1{fill:#7f0036}
    </style>
    <!-- 白描边（2026-10-03 加）：原图 4 条路径整体缩到 0.90 并居中，让出的边距正好放这圈白边。
         底图是卫星影像时，原来的纯红箭头压在深浅不一的地物上没有轮廓，描一圈白边把它衬出来。
         几何校验：顶点 (36,0)/(0,72)/(72,72) 的外法线恰是径向，缩放让出 0.1×到中心距离
         （顶点 3.6，翼尖 5.09），白边向外只占 6×0.9÷2 = 2.7 ⇒ 最紧的顶点还剩 0.9，viewBox 裁不到。
         描边宽 6 是**局部坐标**（含 0.9 缩放 ⇒ 画面 5.4 单位），stroke-linejoin 用 round：
         miter 在 36.87° 的翼尖上会拉出 3.2 倍尖刺，戳出 viewBox 被裁平。
         ‼️ 四个填充路径的颜色一个字节都没改，原图是硬编码三色红（#c72b27 / #ee3424 / #7f0036）。 -->
    <g transform="translate(36 36) scale(0.9) translate(-36 -36)">
        <path d="M36 0 0 72l36-18 36 18z" fill="#ffffff" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
        <path d="M35.5 2.118v51.573L1.118 70.882z" style="fill:#c72b27"/>
        <path d="M35 4.236v49.146L2.236 69.764zM36 0 0 72l36-18z" class="st1"/>
        <path d="M36.5 53.691V2.118l34.382 68.764z" style="fill:#ee3424"/>
        <path d="m37 4.236 32.764 65.528L37 53.382zM36 0v54l36 18z" class="st1"/>
    </g>
</svg>
